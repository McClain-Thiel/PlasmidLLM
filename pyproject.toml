[project]
name = "plasmid-llm"
version = "0.1.0"
description = "Language models for plasmid DNA sequence generation"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1,<2.10",
    "transformers>=4.38",
    "tokenizers>=0.15",
    "pyarrow>=14.0",
    "pandas>=2.0",
    "mlflow>=2.10",
    "boto3>=1.28",
    "psutil>=5.9",
    "ipykernel>=7.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.2"]
pretrain = ["accelerate>=0.26", "biopython>=1.80", "wandb>=0.19"]
rl = [
    "ray[default]>=2.9",     # Distributed post-training
    "parasail>=1.3.0",       # Smith-Waterman sequence alignment
    "biopython>=1.80",       # DNA translation utilities
]
rebuttal = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "wandb>=0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plasmid_llm"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Ray + model download (may be slow)"]

[dependency-groups]
dev = [
    "marimo>=0.23.1",
]
