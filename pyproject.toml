[project]
name = "plasmid-llm"
version = "0.1.0"
description = "PlasmidLM: A Promptable DNA Language Model via Verifiable-Reward Post-Training"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "McClain Thiel" },
    { name = "Chris P. Barnes" },
]
keywords = [
    "plasmid",
    "DNA",
    "dna-language-model",
    "reinforcement-learning",
    "GRPO",
    "synthetic-biology",
    "genomics",
    "bioinformatics",
]
dependencies = [
    "torch>=2.1,<2.10",
    "transformers>=4.38",
    "tokenizers>=0.15",
    "pyarrow>=14.0",
    "pandas>=2.0",
    "mlflow>=2.10",
    "boto3>=1.28",
    "psutil>=5.9",
    "ipykernel>=7.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.2"]
pretrain = ["accelerate>=0.26", "biopython>=1.80", "wandb>=0.19"]
rl = [
    "ray[default]>=2.9",     # Distributed post-training
    "parasail>=1.3.0",       # Smith-Waterman sequence alignment
    "biopython>=1.80",       # DNA translation utilities
]
rebuttal = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "wandb>=0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plasmid_llm"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
"notebooks/*.py" = ["E702"]
"tests/*" = ["E402"]
"tests/smoke_test.py" = ["E402", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Ray + model download (may be slow)"]

[dependency-groups]
dev = [
    "marimo>=0.23.1",
]

[project.urls]
Homepage = "https://doi.org/10.64898/2026.05.19.725242"
Repository = "https://github.com/McClain-Thiel/PlasmidLLM"
Paper = "https://doi.org/10.64898/2026.05.19.725242"
Models = "https://huggingface.co/McClain/PlasmidLM-kmer6-GRPO-plannotate"
Dataset = "https://huggingface.co/datasets/McClain/PlasmidLM-Eval"
Demo = "https://huggingface.co/spaces/McClain/PlasmidSpace"
Issues = "https://github.com/McClain-Thiel/PlasmidLLM/issues"
